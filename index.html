der-radius:290px 290px 2px 2px\"><img class=\"zoom\" src=\"a0b0ae09-ff86-45bd-a852-40d95d8d2d99\" alt=\"Letícia Chiavagatti sentada em poltrona\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 22%\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><div id=\"sobre\" class=\"sr-stack\" style=\"max-width:760px;margin:0 auto;padding:clamp(72px,10vw,150px) clamp(20px,5vw,64px);display:flex;flex-direction:column;align-items:center;gap:26px\">\n<span style=\"font-size:12px;letter-spacing:.34em;color:#E3BC7E;text-transform:uppercase;font-weight:400\">Sobre<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.06;color:#F5EBDD\">Letícia <span style=\"font-style:italic;color:#E3BC7E\">Chiavagatti<\u002Fspan><\u002Fh2>\n<p style=\"margin:0\">Advogada inscrita na OAB/PR sob o nº 136.500, dedico minha atuação ao Direito Imobiliário, ao Direito Civil e aos inventários, áreas em que o patrimônio e a história de uma família se encontram. Auxilio pessoas na aquisição e na venda de imóveis, na regularização de propriedades, na elaboração de contratos e na organização de partilhas, sempre com atenção ao detalhe que protege cada decisão.<\u002Fp>\n<p style=\"margin:0\">Graduada em Direito pela Unimater e pós-graduanda em Direito Imobiliário pela Unopar, construí minha formação também na prática forense, na Justiça Federal, na Justiça do Trabalho e na advocacia privada, o que me deu rigor técnico e disciplina com prazos e documentos. Atendo online, em todo o território nacional, e presencialmente em Pato Branco/PR.<\u002Fp>\n<\u002Fdiv>\n\n<!-- ÁREAS DE ATUAÇÃO -->\n<div id=\"areas\" style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,150px) clamp(20px,5vw,64px)\">\n<h2 class=\"sr\" style=\"margin:0 0 72px;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.06;color:#F5EBDD\">Áreas de <
